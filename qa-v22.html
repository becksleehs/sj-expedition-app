<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v2.2 QA</title><link rel="stylesheet" href="css/app.css?v=fresh220"><style>body{padding:20px;background:#dff5ff}.qa{max-width:960px;margin:auto;background:white;border-radius:24px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.box{background:#f4fbff;border-radius:18px;padding:10px;text-align:center}.box .avatar-stage{margin:auto}.eq{margin-top:20px;background:#fff7dc;padding:14px;border-radius:18px}.eq .avatar-stage{margin:auto}</style></head><body><div class="qa"><h1>v2.2 실제 웹 캐릭터 QA</h1><div class="grid" id="grid"></div><div class="eq"><h2>실제 장비 조합 예시</h2><div id="eq"></div></div></div><script src="js/app.js?v=fresh220"></script><script src="js/avatar-gear.js?v=fresh220"></script><script>const ids=['f1','f2','f3','m1','m2','m3'];ids.forEach(id=>{const b=document.createElement('div');b.className='box';const a=document.createElement('div');b.appendChild(a);const s=SJGear.normalizeState({gear:{}});SJGear.renderStage(a,id,s);const t=document.createElement('b');t.textContent=id+' '+SJGear.profiles[id].name;b.appendChild(t);grid.appendChild(b)});const s=SJGear.normalizeState({gear:{vest:true,hat:true,scarf:true,backpack:true,shoes:true,camera:true,flag:true,badge:true}});SJGear.renderStage(document.querySelector('#eq'),'f1',s);</script></body></html>
