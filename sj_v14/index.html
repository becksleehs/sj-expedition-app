<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>승주 원정대 2026</title>
  <link rel="stylesheet" href="css/app.css?v=fresh143">
</head>
<body>
<main class="app">
  <header class="topbar">
    <button class="iconbtn" aria-label="설정">⚙️</button>
    <div class="brand">승주 원정대 <span class="badge">FRESH v1.3</span></div>
    <button class="iconbtn" aria-label="메뉴">☰</button>
  </header>

  <section class="hero hero-motion" aria-label="부산 롯데월드, 울릉도, 독도 바다 월드맵">
    <img class="worldmap" src="assets/map/worldmap.jpg?v=fresh143" alt="부산 롯데월드 울릉도 독도 바다 월드맵">

    <!-- FRESH v1.3: 원본 월드맵의 대상만 마스킹해 자연스럽게 움직이는 레이어 -->
    <div class="sea-shine sea-shine-a" aria-hidden="true"></div>
    <div class="sea-shine sea-shine-b" aria-hidden="true"></div>

    <img class="map-sprite gull-sprite gull-left" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite gull-sprite gull-right" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite boat-sprite" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite dolphin-sprite dolphin-a" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite dolphin-sprite dolphin-b" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite whale-sprite" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">

    <img class="map-sprite student-sprite student-1" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite student-sprite student-2" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite student-sprite student-3" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">
    <img class="map-sprite student-sprite student-4" src="assets/map/worldmap.jpg?v=fresh143" aria-hidden="true" alt="">

    <div class="route-dot dot-1" aria-hidden="true"></div>
    <div class="route-dot dot-2" aria-hidden="true"></div>
    <div class="route-dot dot-3" aria-hidden="true"></div>

    <div class="sparkle sp-1" aria-hidden="true">✦</div>
    <div class="sparkle sp-2" aria-hidden="true">✦</div>
    <div class="sparkle sp-3" aria-hidden="true">✦</div>

    <div id="bubbleLayer" class="bubble-layer" aria-hidden="true"></div>
  </section>

  <div class="start-wrap">
    <button class="gamebtn pulse-start" onclick="location.href='select-student.html'">🧭 원정대 시작하기 〉</button>
  </div>

  <section class="menu">
    <div class="tile float-tile"><span>🚩</span>미션</div>
    <div class="tile float-tile delay-1"><span>📸</span>사진첩</div>
    <div class="tile float-tile delay-2"><span>🏆</span>랭킹</div>
  </section>
</main>
<script src="js/app.js?v=fresh143"></script>
<script src="js/home-motion.js?v=fresh143"></script>
</body>
</html>
