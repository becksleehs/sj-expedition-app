<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 선택</title><link rel="stylesheet" href="css/app.css?v=fresh144"></head><body><main class="app"><header class="topbar"><a class="back" href="select-student.html">‹</a><div class="brand">캐릭터 선택</div><span class="badge">ARCADE</span></header><section class="page"><h1 class="title" id="who">탐험가 선택</h1><p class="sub">서로 다른 분위기의 아케이드형 캐릭터 3종 중 하나를 골라주세요.</p><div id="chars" class="characters arcade-characters"></div><div class="notice" style="margin-top:16px">선택한 캐릭터는 장비실에서 스카프·탐험복·카메라·나침반·망원경·태극기·배지를 꾸밀 수 있습니다.</div></section><div class="bottom-action"><button id="go" class="primary" disabled>이 캐릭터로 출발하기</button></div></main><script src="js/app.js?v=fresh144"></script><script>
const p=SJ.current();if(!p)location.href='select-student.html';document.querySelector('#who').textContent=`${p.name}의 캐릭터 선택`;let chosen=SJ.load().avatar||null;const wrap=document.querySelector('#chars');SJ.chars[p.gender].forEach(([id,label])=>{let e=document.createElement('button');e.className='char'+(chosen===id?' selected':'');e.innerHTML=`<div class="char-art"><img src="assets/characters-clean/${id}.png?v=14"></div><strong>${label}</strong><small>${id==='m1'||id==='f1'?'활발한 탐험가':id==='m2'||id==='f2'?'차분한 전략가':'에너지 러너'}</small>`;e.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');chosen=id;document.querySelector('#go').disabled=false};wrap.appendChild(e)});if(chosen)document.querySelector('#go').disabled=false;document.querySelector('#go').onclick=()=>{if(!chosen)return;if(confirm('이 캐릭터로 선택할까요?')){let st=SJ.load();st.avatar=chosen;st.gear=st.gear||{};st.gearColors=st.gearColors||{};SJ.save(st);location.href='home.html'}};
</script></body></html>
