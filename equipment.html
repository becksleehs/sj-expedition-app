<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장비 꾸미기</title><link rel="stylesheet" href="css/app.css?v=fresh160"></head><body><main class="app"><header class="topbar"><a class="back" href="home.html">‹</a><div class="brand">장비 꾸미기</div><span class="badge">ARCADE</span></header><section class="page equipment-page"><div class="equipment-head"><div><h1 class="title left">나만의 원정대</h1><p class="sub left">아이템을 눌러 장착·해제하고 색상을 바꿔보세요.</p></div><button id="resetGear" class="mini-btn">↻ 초기화</button></div><div class="equip-stage-card"><div id="stage"></div><div class="equip-name"><strong id="studentName"></strong><span>선택 캐릭터</span></div></div><div class="gear-grid" id="gearGrid"></div><div class="color-panel"><b>색상 선택</b><div id="colors" class="color-row"></div><p id="colorHint">장비를 선택하면 색상을 바꿀 수 있어요.</p></div><div class="notice">같은 장비를 다시 누르면 해제됩니다. 스카프·탐험복·배지는 함께 착용할 수 있고, 카메라·나침반·망원경·태극기는 한 번에 1개만 사용할 수 있어요.</div></section><div class="bottom-action"><button id="done" class="primary">꾸미기 완료</button></div></main><script src="js/app.js?v=fresh160"></script><script src="js/avatar-gear.js?v=fresh160"></script><script>
const p=SJ.current();let s=SJ.load();if(!p||!s.avatar)location.href='select-student.html';s=SJGear.normalizeState(s);SJ.save(s);document.querySelector('#studentName').textContent=p.name;const stage=document.querySelector('#stage');let selected='scarf';
function draw(){SJGear.renderStage(stage,s.avatar,s);document.querySelectorAll('.gear-item').forEach(b=>b.classList.toggle('on',!!s.gear[b.dataset.gear]));document.querySelectorAll('.gear-item').forEach(b=>b.classList.toggle('focus',b.dataset.gear===selected));document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===s.gearColors[selected]));document.querySelector('#colorHint').textContent=`${SJGear.gearMeta[selected].label} 색상`}
const gg=document.querySelector('#gearGrid');Object.entries(SJGear.gearMeta).forEach(([k,m])=>{const b=document.createElement('button');b.className='gear-item';b.dataset.gear=k;b.innerHTML=`<span>${m.emoji}</span><strong>${m.label}</strong><small>${m.slot==='tool'?'도구 1개만':'탭하여 장착'}</small>`;b.onclick=()=>{selected=k;s=SJGear.toggleGear(s,k);SJ.save(s);draw()};gg.appendChild(b)});
const cr=document.querySelector('#colors');SJGear.colors.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.dataset.color=c;b.style.background=c;b.setAttribute('aria-label','색상');b.onclick=()=>{s.gearColors[selected]=c;if(!s.gear[selected])s.gear[selected]=true;SJ.save(s);draw()};cr.appendChild(b)});
document.querySelector('#resetGear').onclick=()=>{Object.keys(s.gear).forEach(k=>s.gear[k]=false);SJ.save(s);draw()};document.querySelector('#done').onclick=()=>location.href='home.html';draw();
</script></body></html>
