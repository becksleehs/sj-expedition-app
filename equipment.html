<div class="app-shell">

<main class="content equipment-v23-page">
  <section class="profile-card equipment-preview-card">

    <div class="equipment-location-grid">

    <p>장비가 해금되면 선택할 수 있습니다. 장착 상태는 학생별로 자동 저장됩니다.</p>
  </section>
