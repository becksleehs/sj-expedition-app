<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>장비 꾸미기</title><link rel="stylesheet" href="css/app.css?v=fresh340"></head><body><main class="app equipment-app-v34"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">장비 꾸미기</div><span class="badge">v3.4</span></header><section class="page equipment-page-v34"><div class="equipment-head-v34"><div><h1 class="title left">나만의 원정대</h1><p class="sub left">메인과 똑같은 캐릭터에 장비가 바로 적용됩니다.</p></div><button id="resetGear" class="mini-btn">↻ 초기화</button></div><div class="equip-stage-card-v34"><div id="stage"></div><div class="equip-name-v34"><strong id="studentName"></strong><span id="gearName">기본형</span></div></div><div class="gear-grid-v34" id="gearGrid"></div><div class="notice compact-v34">아이템을 다시 누르면 해제됩니다. 여러 아이템을 동시에 장착할 수 있어요.</div></section><div class="bottom-action equipment-done-v34"><button id="done" class="primary">꾸미기 완료</button></div></main><script src="js/app.js?v=fresh340"></script><script src="js/auth.js?v=fresh340"></script><script src="js/avatar-gear.js?v=fresh340"></script><script>
const preview=new URLSearchParams(location.search).get('preview')==='1';const p=preview?{id:'s09',grade:3,name:'위지현',gender:'F'}:SJ.current();let s=SJGear.normalizeState(SJ.load());if(preview){s.avatar='f1';s.studentId='s09'}if(!preview&&(!p||!s.avatar))location.href='select-student.html';document.querySelector('#studentName').textContent=p?.name||'위지현';const stage=document.querySelector('#stage');const grid=document.querySelector('#gearGrid');
function draw(){SJGear.renderStage(stage,s.avatar||'f1',s);document.querySelector('#gearName').textContent=SJGear.labelList(s);document.querySelectorAll('.gear-item-v34').forEach(b=>b.classList.toggle('on',!!s.gear[b.dataset.gear]));}
Object.entries(SJGear.gearMeta).forEach(([k,m])=>{const b=document.createElement('button');b.className='gear-item-v34';b.dataset.gear=k;b.innerHTML=`<span>${m.emoji}</span><strong>${m.label}</strong>`;b.onclick=()=>{s=SJGear.toggle(s,k);if(!preview)SJ.save(s);draw()};grid.appendChild(b)});
document.querySelector('#resetGear').onclick=()=>{s.gear={};if(!preview)SJ.save(s);draw()};document.querySelector('#done').onclick=()=>location.href='index.html';draw();
</script><script src="js/special-mission.js?v=fresh340"></script><script src="js/fixed-nav.js?v=fresh340"></script></body></html>
