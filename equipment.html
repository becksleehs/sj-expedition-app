<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 성장</title><link rel="stylesheet" href="css/app.css?v=fresh380"></head><body><main class="app growth-app-v35"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">나의 성장</div><span class="badge">GROWTH</span></header><section class="page growth-page-v35"><div class="growth-current-v35"><div id="stage" class="growth-stage-v35"></div><div><h1 id="levelName"></h1><p id="studentName"></p><div class="growth-xp-line-v35"><b id="xpText"></b><span id="nextText"></span></div><div class="growth-bar-v35"><i id="xpBar"></i></div></div></div><button id="upgradeBtn" class="growth-upgrade-btn-v35" type="button"></button><h2 class="growth-section-title-v35">🌱 5단계 성장 로드맵</h2><div id="growthTrack" class="growth-track-v35"></div><div class="notice">XP 조건을 달성하면 “캐릭터를 업그레이드하시겠습니까?” 팝업이 나타납니다. 업그레이드하면 메인 캐릭터도 즉시 바뀝니다.</div></section></main><script src="js/app.js?v=fresh380"></script><script src="js/auth.js?v=fresh380"></script><script src="js/growth.js?v=fresh380"></script><script>
(async()=>{const p=SJ.current();if(!p){location.href='select-student.html';return}let st=await SJGrowth.pull();const stage=document.querySelector('#stage'),track=document.querySelector('#growthTrack'),btn=document.querySelector('#upgradeBtn');function draw(){st=SJGrowth.normalizeState(SJ.load());SJGrowth.render(stage,p.id,st.growthLevel);const li=SJGrowth.info(st.growthLevel),n=SJGrowth.nextInfo(st);document.querySelector('#levelName').textContent=`Lv.${st.growthLevel} ${li.name}`;document.querySelector('#studentName').textContent=`${p.name} · ${p.grade}학년`;document.querySelector('#xpText').textContent=`${st.xp} XP`;document.querySelector('#nextText').textContent=n?`다음 단계 ${n.minXP} XP`:'최종 단계 달성!';document.querySelector('#xpBar').style.width=SJGrowth.progressPct(st)+'%';btn.textContent=SJGrowth.canUpgrade(st)?`✨ Lv.${st.growthLevel+1}로 업그레이드하기`:n?`${n.minXP-st.xp} XP 더 모으면 성장!`:'🏆 독도 수호 탐험가 완성';btn.disabled=!SJGrowth.canUpgrade(st);track.innerHTML='';SJGrowth.levels.forEach(l=>{const reached=l.level<=st.growthLevel;const c=document.createElement('article');c.className='growth-step-v35 '+(l.level===st.growthLevel?'current ':'')+(l.level<st.growthLevel?'done ':'')+(reached?'unlocked':'locked');const thumb=reached?`<img src="${SJGrowth.asset(p.id,l.level)}" alt="${p.name} Lv.${l.level} ${l.name}">`:`<div class="growth-locked-v36" aria-label="아직 공개되지 않은 성장 단계"><span>?</span><i>🔒</i></div>`;c.innerHTML=`<div class="growth-thumb-v35">${thumb}</div><b>Lv.${l.level}</b><small>${l.desc}</small><em>${l.level===1?'START':l.minXP+' XP'}</em>`;track.appendChild(c)})}btn.onclick=async()=>{if(!SJGrowth.canUpgrade(st))return;if(confirm('캐릭터를 업그레이드하시겠습니까?')){await SJGrowth.upgrade();draw()}};window.addEventListener('sj:growth-changed',draw);draw();setTimeout(()=>SJGrowth.checkUpgradePrompt(),250)})();
</script><script src="js/special-mission.js?v=fresh380"></script><script src="js/fixed-nav.js?v=fresh380"></script></body></html>
