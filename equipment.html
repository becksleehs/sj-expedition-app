<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장비 꾸미기</title><link rel="stylesheet" href="css/app.css?v=fresh330"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">장비 꾸미기</div><span class="badge">2D v2.6</span></header><section class="page equipment-page"><div class="equipment-head"><div><h1 class="title left">나만의 원정대</h1><p class="sub left">아래 모습은 시안용 캐릭터를 다시 그린 것이 아니라, 확정한 프리셋 시트의 캐릭터 이미지를 웹에서 그대로 보여줍니다.</p></div><button id="resetGear" class="mini-btn">↻ 기본형</button></div><div class="equip-stage-card"><div id="stage"></div><div class="equip-name"><strong id="studentName"></strong><span id="presetName">기본형</span></div></div><div class="preset-grid-v24" id="presetGrid"></div><div class="notice">이번 버전은 <b>웹에서 보이는 캐릭터 = 확정 프리셋 시트 캐릭터</b>가 되도록 만든 안정판입니다. 같은 프리셋을 다시 누르면 기본형으로 돌아갑니다.</div></section><div class="bottom-action"><button id="done" class="primary">꾸미기 완료</button></div></main><script src="js/app.js?v=fresh330"></script><script src="js/auth.js?v=fresh330"></script><script src="js/avatar-gear.js?v=fresh330"></script><script>
const p=SJ.current();let s=SJ.load();if(!p||!s.avatar)location.href='select-student.html';s=SJGear.normalizeState(s);SJ.save(s);document.querySelector('#studentName').textContent=p.name;const stage=document.querySelector('#stage');
function draw(){SJGear.renderStage(stage,s.avatar,s);document.querySelector('#presetName').textContent=SJGear.presetLabel(s);document.querySelectorAll('.preset-item-v24').forEach(b=>b.classList.toggle('on',b.dataset.preset===s.avatarPreset));}
const grid=document.querySelector('#presetGrid');Object.entries(SJGear.presetMeta).forEach(([k,m])=>{const b=document.createElement('button');b.className='preset-item-v24';b.dataset.preset=k;b.innerHTML=`<span>${m.emoji}</span><strong>${m.label}</strong>`;b.onclick=()=>{s=SJGear.setPreset(s,k);SJ.save(s);draw()};grid.appendChild(b)});
document.querySelector('#resetGear').onclick=()=>{s.avatarPreset='base';SJ.save(s);draw()};document.querySelector('#done').onclick=()=>location.href='index.html';draw();
</script><script src="js/fixed-nav.js?v=fresh330"></script></body></html>
