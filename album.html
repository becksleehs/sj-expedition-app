<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>원정 앨범</title><link rel="stylesheet" href="css/app.css?v=fresh322"><link rel="stylesheet" href="css/mobile-v311.css?v=fresh322"><link rel="stylesheet" href="css/integrated-v318.css?v=fresh322"></head><body><main class="app subpage-v27 album-app-v38"><header class="subpage-head-v27"><a href="index.html">‹</a><h1>🖼️ 원정 앨범</h1></header><nav class="album-folders" role="tablist" aria-label="앨범 폴더"><button data-folder="photos" role="tab">📷 사진</button><button data-folder="videos" role="tab">🎬 동영상</button><button data-folder="missions" role="tab">🎯 미션 제출함</button></nav><p class="media-help">동영상: 3분 이내 · 150MB 이하. 미션 보상은 미션 탭에서 제출할 때 지급됩니다.</p><section id="albumUploadPanel" class="album-upload-v38"><div><b>📸 사진 · 동영상 올리기</b><p>사진은 자동으로 줄여서 업로드됩니다. 등록자와 서버 등록 시간이 함께 표시돼요.</p></div><input id="albumFile" type="file" accept="image/*" hidden><button id="albumPick" type="button">파일 선택</button><input id="albumCaption" maxlength="80" placeholder="한 줄 설명 (선택)"><button id="albumUpload" type="button" disabled>업로드</button><div id="albumPreview" class="album-preview-v38" hidden></div><p id="albumStatus" role="status"></p></section><section class="album-info-v38"><b>⏱️ 업로드 순서</b><span>서버 등록 시간을 기준으로 순번을 표시합니다.</span></section><section id="albumGrid" class="album-grid-v38"><div class="album-loading-v38">사진을 불러오는 중…</div></section></main><script src="js/app.js?v=fresh322"></script><script src="js/auth.js?v=fresh322"></script><script src="js/growth.js?v=fresh322"></script><script src="js/media-upload.js?v=fresh322"></script><script src="js/album.js?v=fresh322"></script><script src="js/fixed-nav.js?v=fresh322"></script></body></html>
