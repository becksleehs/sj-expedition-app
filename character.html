<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 선택</title><link rel="stylesheet" href="css/app.css?v=fresh310"></head><body><main class="app"><header class="topbar"><a class="back" id="backLink" href="select-student.html">‹</a><div class="brand">캐릭터 선택</div><span class="badge">2D</span></header><section class="page"><h1 class="title" id="who">탐험가 선택</h1><p class="sub" id="guide">승주 원정대에서 사용할 캐릭터를 선택하세요.</p><div id="locked" class="notice locked-notice" hidden></div><div id="chars" class="characters arcade-characters"></div><div class="notice" style="margin-top:16px">최초 선택 후 캐릭터 변경은 <b>딱 1회</b> 가능합니다.</div></section><div class="bottom-action"><button id="go" class="primary" disabled>이 캐릭터로 선택하기</button></div></main>
<div id="pwModal" class="security-modal-v30" hidden><div class="security-card-v30"><h2>🔐 내 비밀번호 만들기</h2><p>다른 학생이 내 캐릭터로 접속하지 못하도록 숫자 4자리 비밀번호를 설정하세요.</p><input id="newPw" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리"><input id="newPw2" type="password" inputmode="numeric" maxlength="4" placeholder="한 번 더 입력"><button id="saveChoice" type="button">캐릭터 + 비밀번호 저장</button><button id="pwCancel" class="secondary-security-v30" type="button">취소</button></div></div>
<script src="js/app.js?v=fresh310"></script><script src="js/auth.js?v=fresh310"></script><script src="js/avatar-gear.js?v=fresh310"></script><script>
SJ.setRole('student');const p=SJ.current();if(!p)location.replace('select-student.html');let st=SJ.load(),hadAvatar=!!st.avatar,used=Number(st.avatarChangesUsed)||0,chosen=st.avatar||null;document.querySelector('#who').textContent=p.name+'의 캐릭터 선택';const locked=hadAvatar&&used>=1;
function persistAvatar(){let now=SJ.load();if(hadAvatar&&chosen!==now.avatar)now.avatarChangesUsed=1;now.avatar=chosen;now.avatarPreset=now.avatarPreset||'base';SJ.save(now)}
if(locked){document.querySelector('#guide').textContent='캐릭터 변경 1회를 이미 사용했습니다.';document.querySelector('#locked').hidden=false;document.querySelector('#locked').textContent='🔒 다시 변경하려면 교사 초기화가 필요합니다.';document.querySelector('#go').textContent='메인으로 돌아가기';document.querySelector('#go').disabled=false;document.querySelector('#go').onclick=()=>location.href='index.html'}else{const wrap=document.querySelector('#chars');SJ.chars[p.gender].forEach(([id,label])=>{const e=document.createElement('button');e.className='char'+(chosen===id?' selected':'');e.innerHTML=`<div class="char-art" data-avatar="${id}"></div><strong>${label}</strong><small>${SJGear.profiles[id].name}</small>`;SJGear.renderChoice(e.querySelector('.char-art'),id);e.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');chosen=id;document.querySelector('#go').disabled=false};wrap.appendChild(e)});if(chosen)document.querySelector('#go').disabled=false;document.querySelector('#go').onclick=async()=>{if(!chosen)return;if(hadAvatar){if(confirm('정말 캐릭터를 변경할까요? 변경 기회는 이번 1회뿐입니다.')){persistAvatar();location.href='index.html'};return}try{const x=await SJAuth.status(p.id);if(x.registered){persistAvatar();location.href='select-student.html?force=1&student='+encodeURIComponent(p.id);return}document.querySelector('#pwModal').hidden=false}catch(e){alert('보안 서버에 연결하지 못했습니다.')}}}
document.querySelector('#saveChoice').onclick=async()=>{const a=document.querySelector('#newPw').value.trim(),b=document.querySelector('#newPw2').value.trim();if(!/^\d{4}$/.test(a)){alert('숫자 4자리로 설정해주세요.');return}if(a!==b){alert('두 비밀번호가 다릅니다.');return}const btn=document.querySelector('#saveChoice');btn.disabled=true;btn.textContent='저장 중…';try{const r=await SJAuth.register(p.id,a);persistAvatar();let now=SJ.load();now.authToken=r.token;SJ.save(now);location.href='index.html'}catch(e){alert(e.message);btn.disabled=false;btn.textContent='캐릭터 + 비밀번호 저장'}};document.querySelector('#pwCancel').onclick=()=>document.querySelector('#pwModal').hidden=true;
</script></body></html>
