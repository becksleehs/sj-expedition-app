<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>나의 캐리커처</title><link rel="stylesheet" href="css/app.css?v=fresh350"></head><body><main class="app growth-intro-app-v35"><header class="topbar"><a class="back" href="select-student.html">‹</a><div class="brand">나의 캐리커처</div><span class="badge">Lv.1</span></header><section class="page growth-intro-v35"><h1 class="title" id="who"></h1><p class="sub">학생 사진을 참고한 승주 원정대 전용 캐리커처예요.</p><div id="charPreview" class="growth-intro-preview-v35"></div><div class="growth-level-chip-v35">Lv.1 기본 대원 · 기본 캐리커처</div><div class="notice">미션과 활동으로 XP를 모으면 <b>5단계까지 성장</b>할 수 있어요.</div></section><div class="bottom-action"><button id="go" class="primary">이 캐릭터로 원정 시작하기</button></div></main>
<div id="pwModal" class="security-modal-v30" hidden><div class="security-card-v30"><h2>🔐 내 비밀번호 만들기</h2><p>다른 학생이 내 캐릭터로 접속하지 못하도록 숫자 4자리 비밀번호를 설정하세요.</p><input id="newPw" type="password" inputmode="numeric" maxlength="4" placeholder="숫자 4자리"><input id="newPw2" type="password" inputmode="numeric" maxlength="4" placeholder="한 번 더 입력"><button id="saveChoice" type="button">캐릭터 + 비밀번호 저장</button><button id="pwCancel" class="secondary-security-v30" type="button">취소</button></div></div>
<script src="js/app.js?v=fresh350"></script><script src="js/auth.js?v=fresh350"></script><script src="js/growth.js?v=fresh350"></script><script>
SJ.setRole('student');const p=SJ.current();if(!p)location.replace('select-student.html');let st=SJGrowth.normalizeState(SJ.load());st.studentId=p.id;st.avatar=p.id;st.growthLevel=Math.max(1,st.growthLevel||1);SJ.save(st);document.querySelector('#who').textContent=p.name+'의 기본 캐리커처';SJGrowth.render(document.querySelector('#charPreview'),p.id,1);
document.querySelector('#go').onclick=async()=>{try{const x=await SJAuth.status(p.id);if(x.registered){location.href='select-student.html?force=1&student='+encodeURIComponent(p.id);return}document.querySelector('#pwModal').hidden=false}catch{alert('보안 서버에 연결하지 못했습니다.')}};
document.querySelector('#saveChoice').onclick=async()=>{const a=document.querySelector('#newPw').value.trim(),b=document.querySelector('#newPw2').value.trim();if(!/^\d{4}$/.test(a)){alert('숫자 4자리로 설정해주세요.');return}if(a!==b){alert('두 비밀번호가 다릅니다.');return}const btn=document.querySelector('#saveChoice');btn.disabled=true;btn.textContent='저장 중…';try{const r=await SJAuth.register(p.id,a);st.authToken=r.token;st.avatar=p.id;st.xp=st.xp||0;st.growthLevel=1;SJ.save(st);await SJGrowth.push(st);location.href='index.html'}catch(e){alert(e.message);btn.disabled=false;btn.textContent='캐릭터 + 비밀번호 저장'}};document.querySelector('#pwCancel').onclick=()=>document.querySelector('#pwModal').hidden=true;
</script></body></html>
