<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 선택</title><link rel="stylesheet" href="css/app.css?v=fresh201"></head><body><main class="app"><header class="topbar"><a class="back" id="backLink" href="home.html">‹</a><div class="brand">캐릭터 선택</div><span class="badge">2D AVATAR</span></header><section class="page"><h1 class="title" id="who">탐험가 선택</h1><p class="sub" id="guide">작고 귀여운 승주 원정대 2D 아바타 3종 중 하나를 골라주세요.</p><div id="locked" class="notice locked-notice" hidden></div><div id="chars" class="characters arcade-characters"></div><div class="notice" style="margin-top:16px">최초 선택 후 캐릭터 변경은 <b>딱 1회</b> 가능합니다. 교사가 초기화하면 다시 처음부터 선택할 수 있습니다.</div></section><div class="bottom-action"><button id="go" class="primary" disabled>이 캐릭터로 선택하기</button></div></main><script src="js/app.js?v=fresh201"></script><script src="js/avatar-gear.js?v=fresh201"></script><script>
const p=SJ.current();if(!p)location.replace('select-student.html');
let st=SJ.load(); const hadAvatar=!!st.avatar; const used=Number(st.avatarChangesUsed)||0;
document.querySelector('#backLink').href=hadAvatar?'home.html':'select-student.html';
document.querySelector('#who').textContent=`${p.name}의 캐릭터 선택`;
const locked=hadAvatar&&used>=1;
if(locked){document.querySelector('#guide').textContent='캐릭터 변경 1회를 이미 사용했습니다.';document.querySelector('#locked').hidden=false;document.querySelector('#locked').innerHTML='🔒 캐릭터 변경 완료<br><small>다시 변경하려면 교사 초기화가 필요합니다.</small>';document.querySelector('#go').textContent='학생 메인으로 돌아가기';document.querySelector('#go').disabled=false;document.querySelector('#go').onclick=()=>location.href='home.html';}
else{
 let chosen=st.avatar||null;const wrap=document.querySelector('#chars');SJ.chars[p.gender].forEach(([id,label])=>{let e=document.createElement('button');e.className='char'+(chosen===id?' selected':'');e.innerHTML=`<div class="char-art" data-avatar="${id}"></div><strong>${label}</strong><small>${SJGear.profiles[id].name}</small>`;SJGear.renderChoice(e.querySelector(".char-art"),id);e.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');chosen=id;document.querySelector('#go').disabled=false};wrap.appendChild(e)});if(chosen)document.querySelector('#go').disabled=false;
 if(hadAvatar){document.querySelector('#guide').textContent='캐릭터 변경 기회가 1번 남았습니다. 변경 후에는 다시 바꿀 수 없어요.';document.querySelector('#go').textContent='캐릭터 1회 변경하기';}
 document.querySelector('#go').onclick=()=>{if(!chosen)return;const msg=hadAvatar?'정말 캐릭터를 변경할까요? 변경 기회는 이번 1회뿐입니다.':'이 캐릭터로 선택할까요?';if(confirm(msg)){let now=SJ.load();if(hadAvatar && chosen!==now.avatar) now.avatarChangesUsed=1;now.avatar=chosen;now.gear=now.gear||{};now.gearColors=now.gearColors||{};SJ.save(now);location.href='home.html'}};
}
</script></body></html>
