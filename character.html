<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>캐릭터 선택</title><link rel="stylesheet" href="css/app.css?v=fresh1"></head><body><main class="app"><header class="topbar"><a class="back" href="select-student.html">‹</a><div class="brand">캐릭터 선택</div><span class="badge">ARCADE</span></header><section class="page"><h1 class="title" id="who">탐험가 선택</h1><p class="sub">서로 다른 스타일의 3종 중 하나를 골라주세요.</p><div id="chars" class="characters"></div><div class="notice" style="margin-top:16px">🎒 장비 시스템은 이 새 캐릭터 규격을 기준으로만 제작합니다. 기존 캐릭터/장비 파일은 사용하지 않습니다.</div></section><div class="bottom-action"><button id="go" class="primary" disabled>이 캐릭터로 출발하기</button></div></main><script src="js/app.js?v=fresh1"></script><script>
const p=SJ.current();if(!p)location.href='select-student.html';document.querySelector('#who').textContent=`${p.name}의 캐릭터 선택`;let chosen=null;const wrap=document.querySelector('#chars');SJ.chars[p.gender].forEach(([id,label])=>{let e=document.createElement('button');e.className='char';e.innerHTML=`<img src="assets/characters/${id}.jpg?v=fresh1"><strong>${label}</strong>`;e.onclick=()=>{document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));e.classList.add('selected');chosen=id;document.querySelector('#go').disabled=false};wrap.appendChild(e)});document.querySelector('#go').onclick=()=>{if(!chosen)return;if(confirm('이 캐릭터로 선택할까요?')){let st=SJ.load();st.avatar=chosen;SJ.save(st);location.href='home.html'}};
</script></body></html>
