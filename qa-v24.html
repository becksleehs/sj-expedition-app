<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>v2.4 QA</title><link rel="stylesheet" href="css/app.css?v=fresh250"><style>body{background:#dff5ff;padding:20px}.qa{max-width:1000px;margin:auto;background:#fff;border-radius:24px;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.cell{background:#f4fbff;border-radius:18px;padding:12px;text-align:center}.cell>div{margin:auto}.states{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.state{background:#fff7dc;border-radius:16px;padding:10px;text-align:center}.state>div{margin:auto}</style></head><body><div class="qa"><h1>v2.4 실제 웹 렌더링 QA</h1><div id="baseGrid" class="grid"></div><h2>위지현 프리셋 9종</h2><div id="states" class="states"></div></div><script src="js/avatar-gear.js?v=fresh250"></script><script>const ids=['f1','f2','f3','m1','m2','m3'];ids.forEach(id=>{const c=document.createElement('div');c.className='cell';const a=document.createElement('div');c.appendChild(a);SJGear.renderStage(a,id,{avatarPreset:'base'});const b=document.createElement('b');b.textContent=SJGear.profiles[id].name;c.appendChild(b);baseGrid.appendChild(c)});Object.keys(SJGear.presetMeta).forEach(k=>{const c=document.createElement('div');c.className='state';const a=document.createElement('div');c.appendChild(a);SJGear.renderStage(a,'f1',{avatarPreset:k});const b=document.createElement('b');b.textContent=SJGear.presetMeta[k].label;c.appendChild(b);states.appendChild(c)});</script></body></html>
