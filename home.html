<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>승주 원정대</title><link rel="stylesheet" href="css/app.css?v=fresh250"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">⌂</a><div class="brand">승주 원정대</div><span class="badge">2026</span></header><section class="page"><div class="card profile"><div id="avatarStage"></div><div class="profile-text"><h2 id="name"></h2><strong>원정대 Lv.1</strong><p>부산 · 울릉도 · 독도 대모험</p><div class="xp"><i></i></div><div id="gearSummary" class="gear-summary"></div><div id="changeInfo" class="change-info"></div></div></div><div class="card"><h2 style="margin-top:0">🗺️ 오늘의 모험</h2><div class="notice">10월 14일 부산 롯데월드를 시작으로 울릉도와 독도를 탐험합니다. 미션은 선생님이 공개하면 참여할 수 있어요.</div></div><div class="quick" id="quick"><a href="missions.html"><b>🚩</b>미션</a><a href="quiz.html"><b>🚌</b>버스 퀴즈</a><a id="charChange" href="character.html"><b>🧑‍🚀</b><span>캐릭터 변경</span></a><a href="equipment.html"><b>🎒</b>장비실</a><a href="#"><b>📷</b>사진첩</a><a href="#"><b>🏆</b>랭킹</a></div></section></main><script src="js/app.js?v=fresh250"></script><script src="js/avatar-gear.js?v=fresh250"></script><script>const p=SJ.current();let s=SJ.load();if(!p||!s.avatar)location.replace('select-student.html');s=SJGear.normalizeState(s);document.querySelector('#name').textContent=p.name;SJGear.renderStage(document.querySelector('#avatarStage'),s.avatar,s,{small:true});document.querySelector('#gearSummary').textContent=SJGear.presetLabel(s);const left=SJ.remainingAvatarChanges();document.querySelector('#changeInfo').textContent=left?'캐릭터 변경 1회 가능':'캐릭터 변경 완료';const link=document.querySelector('#charChange');if(!left){link.classList.add('disabled-link');link.removeAttribute('href');link.querySelector('span').textContent='캐릭터 변경 완료';link.onclick=()=>alert('캐릭터 변경 1회를 이미 사용했습니다. 교사 초기화 후 다시 선택할 수 있어요.');}</script></body></html>
