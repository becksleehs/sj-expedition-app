<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="css/app.css?v=fresh250"><style>body{background:#d7f3ff}.qa{width:920px;margin:20px auto;background:white;padding:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.cell{background:#eefaff;border-radius:20px;padding:12px;text-align:center}.cell .avatar-stage.v23{width:250px;height:333px;margin:auto}.label{font-weight:900}</style></head><body><div class="qa"><div class="grid" id="g"></div></div><script src="js/avatar-gear.js?v=fresh250"></script><script>const ids=['f1','f2','f3','m1','m2','m3'];const state={gear:{vest:true,hat:true,scarf:true,backpack:true,shoes:true,camera:true,binoculars:true,compass:true,flag:false,badge:true}};for(const id of ids){const c=document.createElement('div');c.className='cell';c.innerHTML='<div class="stage"></div><div class="label">'+id+'</div>';document.querySelector('#g').appendChild(c);SJGear.renderStage(c.querySelector('.stage'),id,JSON.parse(JSON.stringify(state)));}</script></body></html>
