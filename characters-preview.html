<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>승주 원정대 · 캐릭터 성장 보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5ef;color:#20394a;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:20px 14px 40px}h1{font-size:23px;margin:0 0 8px}p{font-size:14px;line-height:1.6;color:#536777}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:20px 0}select{font:inherit;padding:12px;border:1px solid #c0cfd2;border-radius:12px;background:white;flex:1;min-height:48px}.stage{background:linear-gradient(#e7f5fc,#fff);border-radius:24px;text-align:center;padding:16px}.stage img{display:block;width:100%;height:330px;object-fit:contain}.stage h2{font-size:19px;margin:8px}.levels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}.levels button{font:inherit;border:2px solid transparent;background:white;border-radius:12px;padding:6px 2px;color:#304c5d;min-height:48px}.levels button[aria-pressed=true]{border-color:#2587b6;background:#e7f6ff}.levels img{display:block;width:100%;height:100px;object-fit:contain}.levels b{display:block;font-size:12px}.levels small{font-size:10px}.hint{font-size:12px}.all{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:20px}.all button{background:white;border:0;border-radius:15px;padding:10px 3px;font:inherit;color:inherit}.all img{width:100%;height:150px;object-fit:contain}.all b{display:block;font-size:13px}.all small{font-size:11px;color:#637984}@media(min-width:600px){.all{grid-template-columns:repeat(5,minmax(0,1fr))}.levels img{height:140px}}@media(max-width:360px){.stage img{height:280px}.all img{height:125px}}
</style><link rel="stylesheet" href="css/integrated-v318.css?v=fresh319final"></head><body><main><h1>승주 원정대 · 캐릭터 성장 보기</h1><p>13명 모두의 전신 캐릭터와 5단계 성장 모습을 확인해 보세요.</p><div class="controls"><label for="student">학생 선택</label><select id="student"></select></div><section class="stage" aria-live="polite"><img id="hero" alt=""><h2 id="name"></h2><p id="description"></p></section><nav class="levels" aria-label="성장 단계" id="levels"></nav><p class="hint">미리보기 전용입니다. 학생의 경험치나 실제 성장 단계는 바뀌지 않습니다.</p><h2>우리 원정대 13명</h2><div class="all" id="all"></div></main><script src="js/app.js?v=fresh319final"></script><script src="js/growth.js?v=fresh319final"></script><script>
(()=>{const select=document.querySelector('#student');let stage=1;SJ.students.forEach(s=>select.add(new Option(`${s.grade}학년 ${s.name}`,s.id)));function draw(){const s=SJ.students.find(s=>s.id===select.value);const info=SJGrowth.info(stage);const hero=document.querySelector('#hero');hero.src=SJGrowth.asset(s.id,stage);hero.alt=`${s.name} ${stage}단계 전신`;document.querySelector('#name').textContent=`${s.name} · Lv.${stage} ${info.name}`;document.querySelector('#description').textContent=info.desc;const levels=document.querySelector('#levels');levels.replaceChildren();SJGrowth.levels.forEach(l=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-pressed',l.level===stage);b.setAttribute('aria-label',`${l.level}단계 ${l.name}`);b.innerHTML=`<img src="${SJGrowth.asset(s.id,l.level)}" alt=""><b>Lv.${l.level}</b><small>${l.minXP} XP</small>`;b.onclick=()=>{stage=l.level;draw()};levels.append(b)})}select.onchange=draw;const all=document.querySelector('#all');SJ.students.forEach(s=>{const b=document.createElement('button');b.type='button';b.innerHTML=`<img loading="lazy" src="${SJGrowth.asset(s.id,1)}" alt="${s.name} 전신"><b>${s.name}</b><small>${s.grade}학년</small>`;b.onclick=()=>{select.value=s.id;stage=1;draw();window.scrollTo({top:0,behavior:'smooth'})};all.append(b)});draw()})();
</script></body></html>
