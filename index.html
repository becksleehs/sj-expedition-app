<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json"><link rel="stylesheet" href="css/v3.css?v=300">
</head><body><div class="v3-app">
<header class="v3-top"><a class="v3-brand" href="index.html"><span class="compass">🧭</span><div><small>SJ EXPEDITION</small><b>승주 원정대</b></div></a>
<div class="v3-top-actions"><a href="quiz.html">🚌 퀴즈</a><a href="admin-login.html">⚙️ 관리자</a></div></header>
<main class="v3-shell">
<section class="v3-dashboard">
 <aside class="v3-panel v3-profile">
   <div class="v3-profile-top"><div><small id="profileTeam">원정 준비</small><h2 id="profileName">새로운 탐험가</h2></div><span id="profileLevel">Lv.1</span></div>
   <div id="profileAvatar"></div>
   <div>
     <div class="v3-level"><b id="profileXpText">0 EXP</b><div class="v3-progress"><i id="profileXpBar" style="width:0%"></i></div></div>
     <a class="v3-big-btn" id="continueBtn" href="student.html">⚔️ 원정 시작하기</a>
     <div class="v3-sub-buttons"><a href="equipment.html">🎒 캐릭터 꾸미기</a><a href="quiz.html">🧠 버스 퀴즈</a></div>
   </div>
 </aside>
 <section class="v3-panel v3-map-panel">
   <div class="v3-panel-head"><h2>🗺️ 모험 지도</h2><span>부산 → 울릉도 ↔ 독도</span></div>
   <div class="v3-map-wrap">
     <img src="assets/ui/worldmap-rpg.jpg?v=300" alt="부산 롯데월드, 울릉도, 독도 RPG 탐험 지도">
     <a class="v3-hotspot lotte" href="student.html"><span>🎢</span>부산 롯데월드</a>
     <a class="v3-hotspot ulleung" href="student.html"><span>🏝️</span>울릉도 베이스</a>
     <a class="v3-hotspot dokdo" href="student.html"><span>🇰🇷</span><b id="dokdoLabel">독도 원정 · 출항 대기</b></a>
   </div>
   <div class="v3-map-note"><span>🎢 첫 번째 원정 · 부산 롯데월드</span><span>🏝️ 울릉도 베이스</span><span>🚢 독도는 날씨에 따라 출항 / 보류 / 재도전</span></div>
 </section>
</section>
<section class="v3-side-section">
 <section class="v3-panel"><div class="v3-panel-head"><h3>🎯 오늘의 미션</h3><span id="missionSummary">0개</span></div><div id="homeMissions" class="v3-mission-list"></div></section>
 <section class="v3-panel"><div class="v3-panel-head"><h3>🎮 이동시간 콘텐츠</h3><span>BUS PLAY</span></div><div class="v3-quick">
  <a href="quiz.html"><span>🧠</span>부산·울릉도·독도 퀴즈</a>
  <a href="student.html"><span>🏆</span>개인·조별 랭킹</a>
  <a href="equipment.html"><span>🎒</span>장비 꾸미기</a>
  <a href="student.html"><span>📸</span>사진 미션</a>
 </div></section>
</section>
</main>
<nav class="v3-bottom"><a class="active" href="index.html"><span>🗺️</span>메인</a><a href="student.html"><span>🎯</span>미션</a><a href="quiz.html"><span>🚌</span>퀴즈</a><a href="equipment.html"><span>🎒</span>꾸미기</a><a href="admin-login.html"><span>⚙️</span>설정</a></nav>
</div><script src="js/data.js?v=300"></script><script src="js/v3-core.js?v=300"></script><script>
const id=localStorage.getItem('sj_current_student');
if(id && studentById(id)){
 const s=studentById(id),xp=totalXp(id),lv=Math.floor(xp/100)+1,within=xp%100;
 $('#profileName').textContent=s.name+' 탐험가'; $('#profileTeam').textContent=state.teams[id]||s.grade+'학년 원정대';
 $('#profileLevel').textContent='Lv.'+lv; $('#profileXpText').textContent=xp+' EXP'; $('#profileXpBar').style.width=within+'%';
 $('#profileAvatar').innerHTML=avatarStage(id); $('#continueBtn').textContent='⚔️ 내 원정 이어가기';
}
const open=D.missions.filter(m=>state.missions[m.id]);
$('#missionSummary').textContent=open.length+'개 공개';
$('#homeMissions').innerHTML=open.slice(0,5).map(m=>`<div class="v3-mission"><span class="icon">${m.icon}</span><div><b>${m.title}</b><small>${m.desc}</small></div><strong>+${m.xp} EXP</strong></div>`).join('');
const ds=state.dokdoStatus||'waiting'; $('#dokdoLabel').textContent=ds==='open'?'독도 원정 · 출항 가능':ds==='retry'?'독도 원정 · 재도전':'독도 원정 · 출항 대기';
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js?v=300').catch(()=>{});}
</script></body></html>
