<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b4b73">
  <title>2026 승주 원정대</title>
  <link rel="stylesheet" href="css/app.css?v=fresh330">
</head>
<body class="dashboard-body-v33">
<main class="app dashboard-v33" id="mainApp">
  <section class="hero-v33" aria-label="부산 롯데월드, 울릉도, 독도 원정 지도">
    <img src="assets/map/main-hero-v33.png?v=fresh330" alt="배 위에서 학생 세 명이 바라보는 부산 롯데월드, 울릉도, 독도 원정 지도">
    <button id="settingsBtn" class="gear-hotspot-v33" type="button" aria-label="설정"></button>
    <button id="hamburgerBtn" class="hamburger-hotspot-v33" type="button" aria-label="메뉴 열기"></button>
  </section>

  <section class="dashboard-content-v33">
    <div class="status-grid-v33">
      <article class="profile-card-v33" id="profileCard">
        <div class="card-title-v33"><span class="title-icon-v33">👤</span><strong>내 캐릭터</strong><b>›</b></div>
        <div id="dashAvatar" class="profile-avatar-v33"><div class="guest-avatar-v33">🧭</div></div>
        <div class="profile-meta-v33"><strong id="dashName">승주 원정대</strong><span id="dashGrade">방문자</span></div>
        <p id="dashRole">부산 · 울릉도 · 독도 대모험</p>
        <button id="profileEdit" class="profile-edit-v33" type="button">학생으로 시작하기</button>
      </article>

      <div class="status-stack-v33">
        <button class="info-card-v33 members-v33" type="button" id="membersBtn">
          <div class="card-title-v33"><span><span class="title-icon-v33">👥</span> 오늘의 원정대원</span><b>›</b></div>
          <div class="members-body-v33">
            <div class="member-avatars-v33" aria-hidden="true">
              <span><img src="assets/avatar-v33/m1.png?v=fresh330" alt=""></span>
              <span><img src="assets/avatar-v33/f1.png?v=fresh330" alt=""></span>
              <span><img src="assets/avatar-v33/m3.png?v=fresh330" alt=""></span>
              <i>+10</i>
            </div>
            <small>함께하는 13명의 친구들</small>
          </div>
        </button>

        <button class="info-card-v33 mission-v33" type="button" id="missionBtn">
          <div class="card-title-v33"><span><span class="title-icon-v33">🎯</span> 오늘의 미션</span><b>›</b></div>
          <div class="mission-paper-v33">
            <strong>?</strong>
            <span>오늘의 미션이<br>아직 공개되지 않았어요!</span>
            <small>선생님이 미션을 열어주면 확인할 수 있어요.</small>
          </div>
        </button>
      </div>
    </div>
  </section>

  <div id="settingsSheet" class="overlay-v33" hidden>
    <button class="overlay-bg-v33" type="button" data-close="settings" aria-label="닫기"></button>
    <section class="settings-sheet-v33">
      <div class="sheet-head-v33"><strong>⚙️ 설정</strong><button type="button" data-close="settings">×</button></div>
      <a id="settingsPrimary" href="select-student.html?force=1"><span>👤</span><b>학생으로 시작하기</b><i>›</i></a>
      <small class="teacher-hint-v33">교사 관리: 왼쪽 설정 버튼을 3초간 길게 누르세요.</small>
    </section>
  </div>

  <div id="menuDrawer" class="drawer-wrap-v33" hidden>
    <button class="drawer-bg-v33" type="button" data-close="menu" aria-label="닫기"></button>
    <aside class="side-drawer-v33">
      <div class="drawer-head-v33"><strong>원정대 메뉴</strong><button type="button" data-close="menu">×</button></div>
      <a href="notices.html"><span>📣</span><b>공지사항</b><i>›</i></a>
      <a href="schedule.html"><span>📅</span><b>일정</b><i>›</i></a>
      <a href="missions.html"><span>🎯</span><b>미션</b><i>›</i></a>
      <a href="chat.html"><span>💬</span><b>채팅</b><i>›</i></a>
      <a href="badges.html"><span>🏅</span><b>배지</b><i>›</i></a>
      <a href="album.html"><span>🖼️</span><b>앨범</b><i>›</i></a>
    </aside>
  </div>
</main>

<div id="roleModal" class="role-modal-v31" hidden>
  <div class="role-card-v31">
    <div class="role-icon-v31">🧭</div>
    <h2>학생인가요?</h2>
    <p>학생은 자신의 이름과 캐릭터를 선택한 뒤<br>숫자 4자리 비밀번호를 설정합니다.</p>
    <div class="role-actions-v31">
      <button id="roleStudent" type="button" class="role-yes-v31">예, 학생입니다</button>
      <button id="roleGuest" type="button" class="role-no-v31">아니오</button>
    </div>
    <small>이 선택은 이 기기에 저장되어 다음 접속부터는 다시 묻지 않습니다.</small>
  </div>
</div>

<div id="securityModal" class="security-modal-v30" hidden>
  <div class="security-card-v30"><h2>🔐 새 비밀번호 설정</h2><p id="securityText">숫자 4자리 비밀번호를 다시 설정해주세요.</p><input id="securityPw" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="숫자 4자리"><input id="securityPw2" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="한 번 더 입력"><button id="securitySave" type="button">비밀번호 저장</button><small>교사가 비밀번호를 초기화한 경우 새 비밀번호를 다시 만들 수 있습니다.</small></div>
</div>
<script src="js/app.js?v=fresh330"></script>
<script src="js/auth.js?v=fresh330"></script>
<script src="js/avatar-gear.js?v=fresh330"></script>
<script src="js/main-dashboard.js?v=fresh330"></script>
<script src="js/fixed-nav.js?v=fresh330"></script>
</body></html>
