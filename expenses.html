<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>교사용 집행내역</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="assets/pwa/icon-180.png"><meta name="theme-color" content="#073963"><meta name="apple-mobile-web-app-capable" content="yes"><script defer src="js/pwa.js?v=fresh324"></script><style>*{box-sizing:border-box}body{margin:0;background:#eef5f8;color:#173d54;font:16px/1.5 sans-serif}main{max-width:620px;margin:auto;padding:20px 16px 60px;padding-top:max(20px,env(safe-area-inset-top))}h1{font-size:25px}h2{font-size:19px;margin:6px 0}a{color:#12587b}button,input,textarea{font:inherit}button{min-height:46px;border:0;border-radius:10px;background:#146a88;color:white;padding:10px 14px;cursor:pointer}button:disabled{opacity:.5}input,textarea{width:100%;border:1px solid #abc0cc;border-radius:9px;padding:12px}textarea{min-height:94px;resize:vertical}.card,#login,.summary{background:white;padding:16px;border-radius:16px;margin:14px 0}.card.done{border-left:6px solid #16805d}.tag,small{color:#526876}.amount{font-size:23px;font-weight:bold}.original{background:#fff4dc;padding:10px;border-radius:8px;white-space:pre-wrap}.actions{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}.actions button{width:100%;margin-bottom:8px}.status{font-size:14px;white-space:pre-wrap}.summary p{margin:5px 0}.controls{display:flex;gap:8px;flex-wrap:wrap}.active{background:#123c54;outline:2px solid #8ecee5}label{display:block}.memoLabel{font-weight:bold;font-size:14px}.save{background:#345569}#error{color:#a32323}button:focus-visible,a:focus-visible{outline:3px solid #eea800}[hidden]{display:none!important}</style></head><body><main><a href="teacher.html">← 관리자 모드</a><h1>💳 현장 집행내역</h1><p>교사용 · 집행 여부와 메모를 기록하세요.</p><section id="login"><label for="expensePin">교사 PIN</label><input id="expensePin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"><p><button id="openExpenses">집행내역 열기</button></p><p id="error" role="alert"></p></section><div id="content" hidden><section class="summary" id="summary"></section><p><small>금액은 첨부 문서의 산출액입니다. 완료 금액은 완료로 체크한 항목의 산출액 합계이며 실제 결제액·선지급액을 계산한 값은 아닙니다.</small></p><div class="controls"><button data-filter="all">전체</button><button data-filter="pending">미집행</button><button data-filter="done">집행 완료</button><button id="reload">새로고침</button><button id="logout">잠그기</button></div><div id="list"></div></div></main><script src="js/expenses.js?v=fresh324"></script></body></html>
