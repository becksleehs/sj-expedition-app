<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>교사용 현장 집행내역 · 승주 원정대</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa/icon-180.png">
  <meta name="theme-color" content="#073963">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <script defer src="js/pwa.js?v=328"></script>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eef5f8;color:#173d54;font:16px/1.5 system-ui,sans-serif}
    main{max-width:620px;margin:auto;padding:max(20px,env(safe-area-inset-top)) 16px max(60px,env(safe-area-inset-bottom))}
    h1{font-size:25px;margin:14px 0 5px}h2{font-size:20px;margin:0}h3{font-size:18px;margin:5px 0}
    a{color:#12587b}button,input,textarea{font:inherit}
    button{min-height:48px;border:0;border-radius:10px;background:#146a88;color:white;padding:10px 14px;cursor:pointer}
    button:disabled{opacity:.5}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #eea800}
    input,textarea{width:100%;border:1px solid #abc0cc;border-radius:9px;padding:12px}
    textarea{min-height:98px;resize:vertical}
    #login,.summary,.card{background:white;padding:16px;border-radius:16px;margin:14px 0}
    .summary-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .summary-head b{font-size:20px}
    .budget-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
    .budget-box{border:1px solid #d3e4ec;background:#f8fcfe;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
    .budget-box b{font-size:14px}.budget-box strong{font-size:18px;white-space:nowrap}
    .budget-box small{line-height:1.35}
    .filters{margin:18px 0}.filters h2{font-size:15px;margin:12px 0 8px}
    .controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
    .controls.status-filters{grid-template-columns:repeat(3,minmax(0,1fr))}
    .controls button{font-size:14px;padding:8px 4px;background:#44748c}
    .controls .active{background:#123c54;outline:2px solid #8ecee5}
    .secondary-actions{display:flex;gap:8px;margin-top:10px}.secondary-actions button{flex:1;background:#345569}
    .fund-section{margin:24px 0}.fund-heading{display:flex;align-items:baseline;justify-content:space-between;gap:6px;flex-wrap:wrap}
    .fund-heading span,.details,small{color:#526876;font-size:13px}
    .card{border:1px solid #e4eef2}.card.done{border-left:6px solid #16805d}
    .amount{font-size:24px;font-weight:750;margin:4px 0 8px}.details{margin:6px 0}
    .original{background:#fff4dc;padding:10px;border-radius:8px;white-space:pre-wrap;font-size:14px}
    .actions{display:grid;gap:8px;margin-top:15px}.actions button{width:100%}
    .toggle{font-weight:700}.done .toggle{background:#16805d}
    .memoLabel{font-weight:700;font-size:14px}.save{background:#345569}
    .status,#feedback{font-size:14px;white-space:pre-wrap}.status{margin:9px 0 0}
    #feedback{min-height:1.5em;color:#1c624e}.empty{padding:20px;background:white;border-radius:12px}
    #error{color:#a32323}[hidden]{display:none!important}
    @media(max-width:370px){.budget-grid{grid-template-columns:1fr}.controls button{font-size:13px}}
  </style>
</head>
<body>
  <main>
    <a href="teacher.html">← 관리자 모드</a>
    <h1>💳 현장 집행내역</h1>
    <p>예산별 항목을 확인하고 결제 후 집행 여부와 메모를 저장하세요.</p>
    <section id="login">
      <label for="expensePin">교사 PIN</label>
      <input id="expensePin" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
      <p><button id="openExpenses">집행내역 열기</button></p>
      <p id="error" role="alert"></p>
    </section>
    <div id="content" hidden>
      <section class="summary" id="summary" aria-label="예산별 집행 현황"></section>
      <p><small>완료 금액은 체크한 항목의 계획액 합계입니다. 실제 결제액이나 선지급액은 메모에 기록하세요.</small></p>
      <div class="filters">
        <h2>예산 선택</h2>
        <div class="controls" aria-label="예산 선택">
          <button type="button" data-fund="all">전체</button>
          <button type="button" data-fund="학교자율">학교자율</button>
          <button type="button" data-fund="수자원">수자원</button>
        </div>
        <h2>집행 상태</h2>
        <div class="controls status-filters" aria-label="집행 상태">
          <button type="button" data-filter="all">전체</button>
          <button type="button" data-filter="pending">미집행</button>
          <button type="button" data-filter="done">집행 완료</button>
        </div>
        <div class="secondary-actions"><button type="button" id="reload">새로고침</button><button type="button" id="logout">잠그기</button></div>
      </div>
      <p id="feedback" role="status"></p>
      <div id="list"></div>
    </div>
  </main>
  <script src="js/expenses.js?v=328"></script>
</body>
</html>
