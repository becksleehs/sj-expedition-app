<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 선택</title><link rel="stylesheet" href="css/app.css?v=fresh380"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">원정대원 선택</div><span class="badge">보안 로그인</span></header><section class="page"><h1 class="title">내 이름을 선택하세요</h1><p class="sub">13명 전체 명단에서 본인 이름을 선택하세요. 비밀번호가 설정된 학생은 본인 비밀번호를 입력해야 접속할 수 있습니다.</p><div id="roster" class="roster"></div></section></main>
<div id="loginModal" class="security-modal-v30" hidden><div class="security-card-v30"><h2 id="loginTitle">🔐 비밀번호 확인</h2><p id="loginText"></p><input id="loginPw" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="숫자 4자리"><button id="loginGo" type="button">확인</button><button id="loginCancel" class="secondary-security-v30" type="button">취소</button></div></div>
<script src="js/app.js?v=fresh380"></script><script src="js/auth.js?v=fresh380"></script><script>
SJ.setRole('student');
const params=new URLSearchParams(location.search), force=params.has('force'), requested=params.get('student');
if(SJ.getRole()==='student'&&SJ.isRegistered()&&!force&&!requested) location.replace('index.html');
const box=document.querySelector('#roster'),modal=document.querySelector('#loginModal'),pw=document.querySelector('#loginPw');let selected=null;
async function choose(s){selected=s;try{const x=await SJAuth.status(s.id);if(x.registered){document.querySelector('#loginTitle').textContent='🔐 '+s.name+' 비밀번호';document.querySelector('#loginText').textContent='본인 확인을 위해 숫자 4자리 비밀번호를 입력하세요.';pw.value='';modal.hidden=false;setTimeout(()=>pw.focus(),50)}else{let st=SJ.load();const same=st.studentId===s.id;st.studentId=s.id;if(!same){st.avatar=s.id;st.xp=0;st.growthLevel=1;st.lastUpgradePromptLevel=1}else if(!st.avatar)st.avatar=s.id;delete st.authToken;SJ.save(st);location.href='character.html'}}catch(e){alert('보안 서버에 연결하지 못했습니다. 잠시 후 다시 시도해주세요.')}}
SJ.students.forEach(s=>{const b=document.createElement('button');b.className='person';b.innerHTML=`${s.name}<small>${s.grade}학년 · ${s.gender==='M'?'남학생':'여학생'}</small>`;b.onclick=()=>choose(s);box.appendChild(b)});
document.querySelector('#loginGo').onclick=async()=>{if(!selected)return;const pass=pw.value.trim();if(!/^\d{4}$/.test(pass)){alert('숫자 4자리를 입력해주세요.');return}try{const r=await SJAuth.login(selected.id,pass);let st=SJ.load(),same=st.studentId===selected.id;st.studentId=selected.id;st.authToken=r.token;if(!same){st.avatar=selected.id;st.xp=0;st.growthLevel=1;st.lastUpgradePromptLevel=1}else if(!st.avatar)st.avatar=selected.id;SJ.save(st);SJ.setRole('student');location.href='index.html'}catch(e){alert(e.message)}};
document.querySelector('#loginCancel').onclick=()=>modal.hidden=true;pw.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#loginGo').click()});
if(requested){const s=SJ.students.find(x=>x.id===requested);if(s)setTimeout(()=>choose(s),80)}
</script><script src="js/fixed-nav.js?v=fresh380"></script></body></html>
