<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학생 선택</title><link rel="stylesheet" href="css/app.css?v=fresh170"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">원정대원 선택</div><span class="badge">13명</span></header><section class="page"><h1 class="title">내 이름을 선택하세요</h1><p class="sub">처음 한 번만 선택하면 다음 접속부터 자동으로 기억합니다.</p><div id="roster" class="roster"></div></section></main><script src="js/app.js?v=fresh170"></script><script>
if(SJ.isRegistered() && !new URLSearchParams(location.search).has('force')) location.replace('home.html');
const box=document.querySelector('#roster');SJ.students.forEach(s=>{const b=document.createElement('button');b.className='person';b.innerHTML=`${s.name}<small>${s.grade}학년 · ${s.gender==='M'?'남학생':'여학생'}</small>`;b.onclick=()=>{let st=SJ.load();st.studentId=s.id;st.avatar=null;st.avatarChangesUsed=0;st.gear={};st.gearColors={};SJ.save(st);location.href='character.html'};box.appendChild(b)});
</script></body></html>
