<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>승주 원정대 관리자</title><link rel="stylesheet" href="css/app.css?v=fresh350"></head><body><main class="app teacher-app-v34"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">교사 관리자</div><span class="badge">ADMIN v3.5</span></header><section class="page"><div id="loginBox" class="teacher-card"><h1 class="title">🔐 교사 확인</h1><p class="sub">교사 PIN을 입력하세요.</p><input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리"><button id="login" class="primary">확인</button></div><div id="adminBox" hidden>
<section class="admin-special-v34"><div class="admin-title-v34"><div><b>🎁 스페셜 미션 보내기</b><small>학생 화면에 즉시 팝업으로 표시됩니다.</small></div><span>LIVE</span></div><div id="currentSpecial" class="current-special-v34">현재 스페셜 미션이 없습니다.</div><textarea id="specialText" maxlength="180" placeholder="예) 독도에서 태극기와 함께 조별 인증사진을 찍으세요!"></textarea><div class="admin-actions-v34"><button id="publishSpecial" type="button">📣 스페셜 미션 전송</button><button id="clearSpecial" type="button">🗑️ 현재 미션 종료</button></div><small class="admin-help-v34">학생이 알림 권한을 허용한 경우 휴대폰 알림도 표시됩니다.</small></section>
<section class="admin-password-v34"><h1 class="title">학생 성장 XP 관리</h1><p class="sub">현장 운영과 테스트를 위해 학생에게 XP를 지급할 수 있습니다.</p><div id="teacherXpRoster" class="teacher-password-list"></div></section><section class="admin-password-v34"><h1 class="title">학생 비밀번호 관리</h1><p class="sub">학생 비밀번호를 초기화하면 다음 접속 때 새 비밀번호를 설정할 수 있습니다.</p><div class="notice teacher-warning">비밀번호 초기화는 <b>어느 기기에서든</b> 가능합니다.</div><div id="teacherRoster" class="teacher-password-list"></div></section>
</div></section></main><script src="js/app.js?v=fresh350"></script><script src="js/auth.js?v=fresh350"></script><script>
const loginBox=document.querySelector('#loginBox'),adminBox=document.querySelector('#adminBox'),pin=document.querySelector('#pin');let teacherPin='';
async function specialRequest(body){const r=await fetch('/.netlify/functions/special-mission',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({...body,teacherPin}),cache:'no-store'});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'스페셜 미션 서버 연결 실패');return d}
async function loadSpecial(){try{const r=await fetch('/.netlify/functions/special-mission',{cache:'no-store'});const d=await r.json();const el=document.querySelector('#currentSpecial');if(d.mission){el.innerHTML=`<b>현재 미션</b><span>${String(d.mission.text).replace(/[<>]/g,'')}</span>`}else el.textContent='현재 스페셜 미션이 없습니다.'}catch{document.querySelector('#currentSpecial').textContent='스페셜 미션 서버 확인 중…'}}
async function awardXp(student,amount,button){button.disabled=true;try{const r=await fetch('/.netlify/functions/student-progress',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'teacher-add-xp',studentId:student.id,amount,teacherPin})});const d=await r.json();if(!r.ok)throw new Error(d.error||'XP 지급 실패');button.closest('.teacher-password-row').querySelector('small').textContent=`${student.grade}학년 · 현재 ${d.progress.xp} XP`;alert(`${student.name} 학생에게 ${amount} XP를 지급했습니다.`)}catch(e){alert(e.message)}finally{button.disabled=false}}
function renderXpRoster(){const box=document.querySelector('#teacherXpRoster');box.innerHTML='';SJ.students.forEach(s=>{const row=document.createElement('div');row.className='teacher-password-row xp-row-v35';row.innerHTML=`<div><b>${s.name}</b><small>${s.grade}학년 · XP 지급</small></div><div class="xp-actions-v35"><button type="button" data-xp="50">+50</button><button type="button" data-xp="100">+100</button></div>`;row.querySelectorAll('button').forEach(b=>b.onclick=()=>awardXp(s,Number(b.dataset.xp),b));box.appendChild(row)})}
function renderRoster(){const box=document.querySelector('#teacherRoster');box.innerHTML='';SJ.students.forEach(s=>{const row=document.createElement('div');row.className='teacher-password-row';row.innerHTML=`<div><b>${s.name}</b><small>${s.grade}학년 · ${s.gender==='M'?'남학생':'여학생'}</small></div><button type="button">비밀번호 초기화</button>`;row.querySelector('button').onclick=async()=>{if(!confirm(`${s.name} 학생의 비밀번호를 초기화할까요?`))return;const b=row.querySelector('button');b.disabled=true;b.textContent='초기화 중…';try{await SJAuth.reset(s.id,teacherPin);alert(`${s.name} 학생 비밀번호가 초기화되었습니다.`);b.textContent='초기화 완료'}catch(e){alert(e.message);b.disabled=false;b.textContent='비밀번호 초기화'}};box.appendChild(row)})}
function openAdmin(){loginBox.hidden=true;adminBox.hidden=false;renderXpRoster();renderRoster();loadSpecial()}
document.querySelector('#login').onclick=async()=>{const v=pin.value.trim();if(!/^\d{4}$/.test(v)){alert('교사 PIN 4자리를 입력하세요.');return}const b=document.querySelector('#login');b.disabled=true;b.textContent='확인 중…';try{await SJAuth.teacherCheck(v);teacherPin=v;openAdmin()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='확인'}};pin.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#login').click()});
document.querySelector('#publishSpecial').onclick=async()=>{const text=document.querySelector('#specialText').value.trim();if(!text){alert('스페셜 미션 내용을 입력해주세요.');return}if(!confirm('이 스페셜 미션을 학생들에게 전송할까요?'))return;const b=document.querySelector('#publishSpecial');b.disabled=true;b.textContent='전송 중…';try{await specialRequest({action:'publish',text});document.querySelector('#specialText').value='';await loadSpecial();alert('스페셜 미션을 전송했습니다. 학생 화면에 최대 약 8초 안에 표시됩니다.')}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='📣 스페셜 미션 전송'}};
document.querySelector('#clearSpecial').onclick=async()=>{if(!confirm('현재 스페셜 미션을 종료할까요?'))return;try{await specialRequest({action:'clear'});await loadSpecial()}catch(e){alert(e.message)}};
</script></body></html>
