<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 모드</title><link rel="stylesheet" href="css/app.css?v=fresh310"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">관리자 모드</div><span class="badge">ADMIN</span></header><section class="page"><div id="loginBox" class="teacher-card"><h1 class="title">🔐 교사 확인</h1><p class="sub">교사 PIN을 입력하세요.</p><input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리"><button id="login" class="primary">확인</button></div><div id="adminBox" hidden><h1 class="title">학생 보안 관리</h1><p class="sub">학생 비밀번호를 초기화하면 다음 접속 때 새 비밀번호를 설정할 수 있습니다.</p><div class="notice teacher-warning">비밀번호 초기화는 <b>어느 기기에서든</b> 가능합니다. 기존 로그인 세션도 다음 확인 때 무효화됩니다.</div><div id="teacherRoster" class="teacher-password-list"></div></div></section></main><script src="js/app.js?v=fresh310"></script><script src="js/auth.js?v=fresh310"></script><script>
const loginBox=document.querySelector('#loginBox'),adminBox=document.querySelector('#adminBox'),pin=document.querySelector('#pin');
function openAdmin(){loginBox.hidden=true;adminBox.hidden=false;const box=document.querySelector('#teacherRoster');box.innerHTML='';SJ.students.forEach(s=>{const row=document.createElement('div');row.className='teacher-password-row';row.innerHTML=`<div><b>${s.name}</b><small>${s.grade}학년 · ${s.gender==='M'?'남학생':'여학생'}</small></div><button type="button">비밀번호 초기화</button>`;row.querySelector('button').onclick=async()=>{if(!confirm(`${s.name} 학생의 비밀번호를 초기화할까요?`))return;const b=row.querySelector('button');b.disabled=true;b.textContent='초기화 중…';try{await SJAuth.reset(s.id,pin.value);alert(`${s.name} 학생 비밀번호가 초기화되었습니다.`);b.textContent='초기화 완료'}catch(e){alert(e.message);b.disabled=false;b.textContent='비밀번호 초기화'}};box.appendChild(row)})}
document.querySelector('#login').onclick=async()=>{const v=pin.value.trim();if(!/^\d{4}$/.test(v)){alert('교사 PIN 4자리를 입력하세요.');return}const b=document.querySelector('#login');b.disabled=true;b.textContent='확인 중…';try{await SJAuth.teacherCheck(v);openAdmin()}catch(e){alert(e.message)}finally{b.disabled=false;b.textContent='확인'}};pin.addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#login').click()});
</script></body></html>
