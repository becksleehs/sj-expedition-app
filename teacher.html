<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교사 초기화</title><link rel="stylesheet" href="css/app.css?v=fresh180"></head><body><main class="app"><header class="topbar"><a class="back" href="index.html">‹</a><div class="brand">교사 관리</div><span class="badge">RESET</span></header><section class="page"><div id="loginBox" class="teacher-card"><h1 class="title">🔐 교사 확인</h1><p class="sub">학생 초기화를 위한 교사 PIN을 입력하세요.</p><input id="pin" class="pin-input" type="password" inputmode="numeric" maxlength="4" placeholder="PIN 4자리"><button id="login" class="primary">확인</button><p class="teacher-hint">기본 PIN: 출발일(월일) 4자리</p></div><div id="adminBox" hidden><h1 class="title">학생 초기화</h1><p class="sub">초기화할 학생을 선택하세요.</p><div class="notice teacher-warning">현재 앱은 휴대폰별로 정보를 저장합니다. <b>초기화는 해당 학생 휴대폰에서 이 화면을 열어 실행</b>해야 합니다.</div><div id="currentInfo" class="current-device"></div><div id="teacherRoster" class="roster teacher-roster"></div></div></section></main><script src="js/app.js?v=fresh180"></script><script>
const loginBox=document.querySelector('#loginBox'),adminBox=document.querySelector('#adminBox');
function openAdmin(){loginBox.hidden=true;adminBox.hidden=false;const cur=SJ.current();document.querySelector('#currentInfo').innerHTML=cur?`📱 이 휴대폰에 저장된 학생: <b>${cur.name}</b>`:'📱 이 휴대폰에는 저장된 학생이 없습니다.';const box=document.querySelector('#teacherRoster');box.innerHTML='';SJ.students.forEach(s=>{const b=document.createElement('button');b.className='person';b.innerHTML=`${s.name}<small>${s.grade}학년 · ${s.gender==='M'?'남학생':'여학생'}</small>`;b.onclick=()=>{const now=SJ.current();if(!now||now.id!==s.id){alert(`${s.name} 학생의 정보는 이 휴대폰에 저장되어 있지 않습니다. 해당 학생 휴대폰에서 초기화를 실행해주세요.`);return;}if(confirm(`${s.name} 학생을 완전히 초기화할까요?\n캐릭터·장비·변경횟수가 모두 초기화됩니다.`)){SJ.resetCurrent();alert(`${s.name} 학생이 초기화되었습니다.`);location.href='index.html'}};box.appendChild(b)})}
document.querySelector('#login').onclick=()=>{if(document.querySelector('#pin').value===SJ.TEACHER_PIN)openAdmin();else alert('PIN이 맞지 않습니다.')};document.querySelector('#pin').addEventListener('keydown',e=>{if(e.key==='Enter')document.querySelector('#login').click()});
</script></body></html>
