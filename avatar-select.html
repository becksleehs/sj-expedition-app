<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/v3.css?v=500"><title>캐릭터 선택</title></head><body class="avatar-page"><div class="app"><header class="avatar-head"><small>CHARACTER SELECT</small><h1>나의 원정대원을 선택하세요</h1><p>얼굴과 체형은 달라도 모든 탐험 장비가 같은 위치에 자연스럽게 장착됩니다.</p></header><main><div id="avatarGrid" class="v3-avatar-grid"></div><button id="startBtn" class="wide-btn" disabled>이 캐릭터로 시작하기</button></main></div><script src="js/data.js?v=500"></script><script src="js/v3-core.js?v=500"></script><script src="js/v5-avatar.js?v=500"></script><script>
const id=localStorage.getItem('sj_current_student'); let picked=null; const s=id&&studentById(id); const grid=document.getElementById('avatarGrid'); const btn=document.getElementById('startBtn'); if(s){const arr=D.avatars.filter(a=>a.gender===s.gender); grid.innerHTML=arr.map(a=>`<button class="v3-avatar-choice" data-id="${a.id}"><div class="v3-avatar-thumb v5-choice-thumb">${avatarChoiceSvg(a)}</div><b>${a.name}</b><small>선택하기</small></button>`).join(''); document.querySelectorAll('.v3-avatar-choice').forEach(b=>b.onclick=()=>{picked=b.dataset.id;document.querySelectorAll('.v3-avatar-choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');btn.disabled=false}); btn.onclick=()=>{state.avatars[id]=picked;state.dress[id]=[];persist();location.href='student.html'}} else {grid.innerHTML='<p>학생을 먼저 선택해주세요.</p>'}
</script></body></html>
